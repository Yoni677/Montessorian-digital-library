<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Materials - School Learning Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #4a90e2;
            --secondary-color: #2c3e50;
            --accent-color: #e74c3c;
            --background-color: #f8f9fa;
            --card-background: #ffffff;
            --text-color: #333333;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: linear-gradient(135deg, var(--secondary-color), var(--primary-color));
            color: white;
            padding: 20px 0;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
        }

        h1, h2 {
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .materials-list {
            background-color: var(--card-background);
            border-radius: 12px;
            padding: 25px;
            box-shadow: var(--shadow);
        }

        .material-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #eee;
            transition: all 0.3s ease;
        }

        .material-item:hover {
            background-color: var(--background-color);
            transform: translateX(5px);
        }

        .material-item:last-child {
            border-bottom: none;
        }

        .material-info {
            flex-grow: 1;
        }

        .material-title {
            font-size: 1.1em;
            margin-bottom: 5px;
        }

        .material-date {
            font-size: 0.9em;
            color: #666;
        }

        .download-btn {
            background-color: var(--primary-color);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            margin-left: 15px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            background-color: #357abd;
            transform: translateY(-2px);
        }

        .back-btn {
            background-color: var(--primary-color);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            background-color: #357abd;
            transform: translateY(-2px);
        }

        .no-materials {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>School Learning Portal</h1>
        </div>
    </header>

    <div class="container">
        <a href="#" class="back-btn" id="backButton">
            <i class="fas fa-arrow-left"></i> Back to Subjects
        </a>
        <h2 id="pageTitle">Materials</h2>

        <div class="materials-list" id="materialsList">
            <div class="loading-state">
                <i class="fas fa-spinner fa-spin" style="font-size: 3rem; color: var(--primary-color); margin-bottom: 15px;"></i>
                <h3>Loading materials...</h3>
            </div>
        </div>
    </div>

    <script type="module">
        // Import Firebase modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, orderBy, onSnapshot, doc, getDoc, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAtDT9NXpij5_XYNn0i8lMT9qZFZt4zaT4",
            authDomain: "examprep-5ed62.firebaseapp.com",
            databaseURL: "https://examprep-5ed62-default-rtdb.firebaseio.com",
            projectId: "examprep-5ed62",
            storageBucket: "examprep-5ed62.appspot.com",
            messagingSenderId: "831664827174",
            appId: "1:831664827174:web:59185778d2835e94c7afe7",
            measurementId: "G-T08HHN32M0"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);
    
        // Enable offline persistence
        enableIndexedDbPersistence(db)
            .catch((err) => {
                if (err.code == 'failed-precondition') {
                    console.warn('Multiple tabs open, persistence can only be enabled in one tab at a time.');
                } else if (err.code == 'unimplemented') {
                    console.warn('The current browser does not support offline persistence');
                }
            });
    
        // Connection status monitoring
        const connectionStatusDiv = document.createElement('div');
        connectionStatusDiv.style.position = 'fixed';
        connectionStatusDiv.style.bottom = '20px';
        connectionStatusDiv.style.right = '20px';
        connectionStatusDiv.style.padding = '10px 20px';
        connectionStatusDiv.style.borderRadius = '5px';
        connectionStatusDiv.style.zIndex = '1000';
        document.body.appendChild(connectionStatusDiv);
    
        // Monitor connection status
        getDoc(doc(db, '.info/connected')).then((snapshot) => {
            const updateConnectionStatus = (isConnected) => {
                connectionStatusDiv.style.backgroundColor = isConnected ? '#4CAF50' : '#f44336';
                connectionStatusDiv.style.color = 'white';
                connectionStatusDiv.innerHTML = `<i class="fas ${isConnected ? 'fa-wifi' : 'fa-wifi-slash'}"></i> ${isConnected ? 'Online' : 'Offline'}`;
            };
    
            onSnapshot(doc(db, '.info/connected'), (snapshot) => {
                updateConnectionStatus(snapshot.data()?.isConnected ?? false);
            }, (error) => {
                console.error('Error monitoring connection:', error);
                updateConnectionStatus(false);
            });
        });
    
        // Get URL parameters and format grade
        const urlParams = new URLSearchParams(window.location.search);
        const gradeNumber = urlParams.get('grade');
        const subject = urlParams.get('subject');

        // Format grade consistently
        const gradeNames = ['One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve'];
        const gradeFormat = `Grade ${gradeNames[Number(gradeNumber) - 1]}`;

        // Update page elements
        document.getElementById('pageTitle').textContent = `${subject} Materials - Grade ${gradeNumber}`;
        document.getElementById('backButton').href = `subjects.html?grade=${gradeNumber}`;

        // Format date consistently
        function formatDate(timestamp) {
            if (!timestamp || !timestamp.toDate) return 'Date not available';
            try {
                const date = timestamp.toDate();
                return date.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            } catch (error) {
                console.error('Error formatting date:', error);
                return 'Date not available';
            }
        }

        // Show error message
        function showError(message) {
            const materialsList = document.getElementById('materialsList');
            materialsList.innerHTML = `
                <div class="no-materials">
                    <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: var(--accent-color); margin-bottom: 15px;"></i>
                    <h3>Error</h3>
                    <p>${message}</p>
                </div>
            `;
        }

        // Show empty state
        function showEmptyState() {
            const materialsList = document.getElementById('materialsList');
            materialsList.innerHTML = `
                <div class="no-materials">
                    <i class="fas fa-folder-open" style="font-size: 3rem; color: var(--primary-color); margin-bottom: 15px;"></i>
                    <h3>No materials available</h3>
                    <p>Check back later for updates</p>
                </div>
            `;
        }

        // Create material element
        function createMaterialElement(material, downloadUrl) {
            const materialElement = document.createElement('div');
            materialElement.className = 'material-item';
            materialElement.innerHTML = `
                <div class="material-info">
                    <div class="material-title">${material.title || 'Untitled Material'}</div>
                    <div class="material-date">
                        <i class="far fa-calendar-alt"></i> Uploaded: ${formatDate(material.uploadDate)}
                    </div>
                    ${material.description ? `<div class="material-description">${material.description}</div>` : ''}
                </div>
                <a href="${downloadUrl}" class="download-btn" target="_blank" download>
                    <i class="fas fa-file-pdf"></i> Download PDF
                </a>
            `;
            return materialElement;
        }

        // Fetch materials
        async function fetchMaterials() {
            const materialsList = document.getElementById('materialsList');
            const maxRetries = 3;
            let retryCount = 0;
        
            const tryFetch = async () => {
                try {
                    const materialsRef = collection(db, 'materials');
                    const q = query(
                        materialsRef,
                        where('grade', '==', gradeFormat),
                        where('subject', '==', subject),
                        orderBy('uploadDate', 'desc')
                    );
        
                    const querySnapshot = await getDocs(q);
        
                    if (querySnapshot.empty) {
                        showEmptyState();
                        return;
                    }
        
                    materialsList.innerHTML = '';
        
                    for (const doc of querySnapshot.docs) {
                        const material = doc.data();
                        try {
                            let downloadUrl = material.downloadUrl;
                            if (!downloadUrl && material.storagePath) {
                                const storageRef = ref(storage, material.storagePath);
                                downloadUrl = await getDownloadURL(storageRef);
                            }
        
                            if (!downloadUrl) {
                                console.warn(`No download URL available for material: ${material.title}`);
                                continue;
                            }
        
                            const materialElement = createMaterialElement(material, downloadUrl);
                            materialsList.appendChild(materialElement);
                        } catch (materialError) {
                            console.error(`Error processing material ${material.title}:`, materialError);
                            continue;
                        }
                    }
                } catch (error) {
                    console.error('Error fetching materials:', error);
                    if (retryCount < maxRetries) {
                        retryCount++;
                        const retryDelay = Math.min(1000 * Math.pow(2, retryCount), 10000);
                        materialsList.innerHTML = `
                            <div class="no-materials">
                                <i class="fas fa-sync fa-spin" style="font-size: 3rem; color: var(--primary-color); margin-bottom: 15px;"></i>
                                <h3>Connection issue</h3>
                                <p>Retrying in ${retryDelay/1000} seconds... (Attempt ${retryCount}/${maxRetries})</p>
                            </div>
                        `;
                        await new Promise(resolve => setTimeout(resolve, retryDelay));
                        return tryFetch();
                    }
                    showError('Unable to load materials. Please check your internet connection and try again.');
                }
            };
        
            await tryFetch();
        }
    
        // Start fetching materials
        fetchMaterials();
    </script>
</body>
</html>
