<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subjects - School Learning Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #4a90e2;
            --secondary-color: #2c3e50;
            --accent-color: #e74c3c;
            --background-color: #f8f9fa;
            --card-background: #ffffff;
            --text-color: #333333;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: linear-gradient(135deg, var(--secondary-color), var(--primary-color));
            color: white;
            padding: 20px 0;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
        }

        h1, h2 {
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .back-btn {
            background-color: var(--primary-color);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background-color: #357abd;
            transform: translateY(-2px);
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            padding: 20px;
        }

        .subject-card {
            background-color: var(--card-background);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .subject-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .subject-icon {
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .subject-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-color);
        }

        .subject-description {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .subjects-grid {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 15px;
                padding: 10px;
            }

            .subject-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>School Learning Portal</h1>
        </div>
    </header>

    <div class="container">
        <div class="navigation">
            <a href="index.html" class="back-btn">
                <i class="fas fa-arrow-left"></i> Back to Grades
            </a>
            <h2 id="gradeTitle">Grade</h2>
        </div>

        <div class="subjects-grid" id="subjectsContainer">
            <!-- Subject cards will be added here dynamically -->
        </div>
    </div>

    <script type="module">
        // Import Firebase modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAtDT9NXpij5_XYNn0i8lMT9qZFZt4zaT4",
            authDomain: "examprep-5ed62.firebaseapp.com",
            databaseURL: "https://examprep-5ed62-default-rtdb.firebaseio.com",
            projectId: "examprep-5ed62",
            storageBucket: "examprep-5ed62.appspot.com",
            messagingSenderId: "831664827174",
            appId: "1:831664827174:web:59185778d2835e94c7afe7",
            measurementId: "G-T08HHN32M0"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Get grade from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const grade = urlParams.get('grade');
        document.getElementById('gradeTitle').textContent = `Grade ${grade} Subjects`;

        // Define subjects with their icons and descriptions
        const subjects = [
            {
                name: 'Mathematics',
                icon: 'fa-square-root-variable',
                description: 'Numbers, Algebra, Geometry, and more'
            },
            {
                name: 'Science',
                icon: 'fa-flask',
                description: 'Physics, Chemistry, and Biology'
            },
            {
                name: 'English',
                icon: 'fa-book',
                description: 'Language, Literature, and Communication'
            },
            {
                name: 'Social Studies',
                icon: 'fa-earth-americas',
                description: 'History, Geography, and Civics'
            },
            {
                name: 'Computer Science',
                icon: 'fa-laptop-code',
                description: 'Programming and Technology'
            },
            {
                name: 'Arts',
                icon: 'fa-palette',
                description: 'Visual Arts and Creative Expression'
            },
            {
                name: 'Music',
                icon: 'fa-music',
                description: 'Musical Theory and Practice'
            },
            {
                name: 'Physical Education',
                icon: 'fa-person-running',
                description: 'Sports and Physical Fitness'
            }
        ];

        // Create subject cards
        const subjectsContainer = document.getElementById('subjectsContainer');
        subjects.forEach(subject => {
            const subjectCard = document.createElement('div');
            subjectCard.className = 'subject-card';
            subjectCard.innerHTML = `
                <i class="fas ${subject.icon} subject-icon"></i>
                <div class="subject-name">${subject.name}</div>
                <div class="subject-description">${subject.description}</div>
            `;
            subjectCard.addEventListener('click', () => {
                window.location.href = `materials.html?grade=${grade}&subject=${encodeURIComponent(subject.name)}`;
            });
            subjectsContainer.appendChild(subjectCard);
        });
    </script>
</body>
</html>
